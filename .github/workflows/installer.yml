name: Build Windows installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run tests
        run: dotnet test SnifferLib.Tests\SnifferLib.Tests.csproj -c Release
      - name: Publish self-contained application
        run: dotnet publish Sniffer\Sniffer.csproj -c Release -r win-x64 --self-contained true -o artifacts\publish
      - name: Create installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler installer\Sniffer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Sniffer-Setup-win-x64
          path: artifacts/installer/Sniffer-Setup-win-x64.exe
          if-no-files-found: error
