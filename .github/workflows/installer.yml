name: Build Windows installer

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate release version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release tag must use the format vMAJOR.MINOR.PATCH: $tag"
          }
          $version = $tag.Substring(1)
          $installer = Get-Content installer\Sniffer.iss -Raw
          if ($installer -notmatch '(?m)^#define AppVersion "([^"]+)"[ \t]*\r?$' -or $Matches[1] -cne $version) {
            throw "Installer AppVersion must match $version."
          }
          $assembly = Get-Content Sniffer\Properties\AssemblyInfo.cs -Raw
          foreach ($attribute in @('AssemblyVersion', 'AssemblyFileVersion')) {
            if ($assembly -notmatch "(?m)^[ \t]*\[assembly:\s*$attribute\(`"([^`"]+)`"\)\]" -or $Matches[1] -cne "$version.0") {
              throw "$attribute must match $version.0."
            }
          }
      - name: Run tests
        run: dotnet test SnifferLib.Tests\SnifferLib.Tests.csproj -c Release
      - name: Publish self-contained application
        run: dotnet publish Sniffer\Sniffer.csproj -c Release -r win-x64 --self-contained true -o artifacts\publish
      - name: Create installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler installer\Sniffer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Sniffer-Setup-win-x64
          path: artifacts/installer/Sniffer-Setup-win-x64.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sniffer-Setup-win-x64
          path: artifacts/installer
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $installer = 'artifacts\installer\Sniffer-Setup-win-x64.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Installer not found: $installer"
          }
          gh release create $env:GITHUB_REF_NAME $installer --verify-tag --draft --generate-notes --title $env:GITHUB_REF_NAME --notes "Npcap is not bundled. Install it separately from https://npcap.com/#download for live capture."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
